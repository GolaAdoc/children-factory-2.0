name: app-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-verify:
    name: app-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Create .env from template
        run: cp .env.example .env
      - name: Start Postgres
        run: docker compose up -d --wait db
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Validate Prisma schema
        working-directory: apps/api
        run: npm run prisma -- validate
      - name: Apply migrations
        working-directory: apps/api
        run: npm run prisma -- migrate deploy
      - name: Verify database
        run: node --env-file=.env scripts/verify-db.mjs
      - name: Generate Prisma client
        working-directory: apps/api
        run: npm run generate
      - name: Build API
        working-directory: apps/api
        run: npm run build
      - name: Unit tests
        working-directory: apps/api
        run: npm test
      - name: E2E tests
        working-directory: apps/api
        run: npm run test:e2e
      - name: Smoke test (runtime env holds only the app-role URL)
        working-directory: apps/api
        run: |
          set -eu
          APP_URL="$(grep '^DATABASE_URL=' ../../.env | cut -d= -f2-)"
          if env -i PATH="$PATH" NODE_ENV=production node dist/main.js > "$RUNNER_TEMP/noenv.log" 2>&1; then
            echo "API started without DATABASE_URL"; exit 1
          fi
          grep -q "Invalid environment" "$RUNNER_TEMP/noenv.log"
          env -i PATH="$PATH" DATABASE_URL="$APP_URL" NODE_ENV=production PORT=3001 \
            node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health -o "$RUNNER_TEMP/health.json"; then ok=1; break; fi
            sleep 1
          done
          kill "$(cat "$RUNNER_TEMP/api.pid")" || true
          [ "$ok" = 1 ] || { echo "health never became ready"; exit 1; }
          cat "$RUNNER_TEMP/health.json"
          grep -q '"status":"ok"' "$RUNNER_TEMP/health.json"
      - name: Build images and start the full stack
        run: docker compose up -d --build --wait
      - name: Seed database
        working-directory: apps/api
        run: |
          APP_URL="$(grep '^DATABASE_URL=' ../../.env | cut -d= -f2-)"
          DATABASE_URL="$APP_URL" npm run db:seed
      - name: Verify catalog
        run: node scripts/verify-catalog.mjs
      - name: Verify stack
        run: node --env-file=.env scripts/verify-stack.mjs
      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Show API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
