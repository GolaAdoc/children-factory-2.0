openapi: 3.0.3
info:
  title: Webstore API (Catalog, read-only)
  version: 0.2.0
  description: >
    Public, read-only catalog. Responses are identical for every caller and never
    depend on Cookie or Authorization, so they are safe to micro-cache at the edge.
    Prices are integers in PKR (whole rupees).
servers:
  - url: http://127.0.0.1:3001
paths:
  /api/categories:
    get:
      operationId: listCategories
      summary: List all categories ordered by name ascending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /api/products:
    get:
      operationId: listProducts
      summary: List active products, 12 per page, newest first
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 60, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        - name: page
          in: query
          required: false
          schema: { type: string, pattern: '^([1-9][0-9]{0,2}|1000)$', default: '1' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductList' }
        '400':
          description: Invalid or unknown query parameter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/products/{slug}:
    get:
      operationId: getProduct
      summary: Get one active product with its active variants
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '400':
          description: Malformed slug
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not found or inactive (indistinguishable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/signup:
    post:
      operationId: signup
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Email or phone already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/login:
    post:
      operationId: login
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/me:
    get:
      operationId: getMe
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  schemas:
    Category:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
    CategoryRef:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
    ProductListItem:
      type: object
      additionalProperties: false
      required: [id, name, slug, basePrice, images, category]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        basePrice: { type: integer, minimum: 0 }
        images: { type: array, items: { type: string } }
        category: { $ref: '#/components/schemas/CategoryRef' }
    ProductList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProductListItem' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [12] }
        total: { type: integer, minimum: 0 }
    Variant:
      type: object
      additionalProperties: false
      required: [id, size, color, price, inStock]
      properties:
        id: { type: string, format: uuid }
        size: { type: string }
        color: { type: string }
        price: { type: integer, minimum: 0 }
        inStock: { type: boolean }
    ProductDetail:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, basePrice, images, attributes, tags, category, variants]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        basePrice: { type: integer, minimum: 0 }
        images: { type: array, items: { type: string } }
        attributes: { type: object, additionalProperties: true }
        tags: { type: array, items: { type: string } }
        category: { $ref: '#/components/schemas/CategoryRef' }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
    ErrorResponse:
      type: object
      description: Generic body from the global exception filter. Never contains stack traces, paths, SQL or connection strings.
      additionalProperties: false
      required: [statusCode, error, message]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, name, phoneNumber]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 100 }
        name: { type: string }
        phoneNumber: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        role: { type: string }
    Session:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/User' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
